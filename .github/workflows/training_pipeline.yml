name: Daily Training and Registry Pipeline

on:
  schedule:
    # Runs once per day after the hourly ingestion cadence has had time to land recent data.
    - cron: "32 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-training-registry-pipeline
  cancel-in-progress: false

jobs:
  train-and-register:
    name: Train, evaluate, and register Karachi AQI models
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONPATH: src
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
      HOPSWORKS_CERT_FOLDER: .hopsworks-certs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify required GitHub Secrets are configured
        run: |
          missing=0
          for name in HOPSWORKS_API_KEY HOPSWORKS_PROJECT HOPSWORKS_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Secret::$name is not configured for this repository."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Train and evaluate candidate models
        run: python scripts/train.py

      - name: Register selected models in Hopsworks
        run: python scripts/register_models.py

      - name: Upload training and registry reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-registry-reports
          path: |
            reports/metrics/model_metrics.csv
            reports/metrics/best_models.json
            reports/metrics/model_registry_report.json
            reports/MODEL_EXPERIMENT_SUMMARY.md
          if-no-files-found: warn

